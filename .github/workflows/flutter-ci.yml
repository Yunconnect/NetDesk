name: NetDesk 最新版编译

on:
  workflow_dispatch:

concurrency:
  group: subnetdesk-flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-pr-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      publish-release: false
      build-mobile: false
